<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>AKASH ARMY</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

html,body{
    width:100%;
    min-height:100%;
    background:#000;
}

body{
    overflow-x:hidden;
    color:#fff;
}

/* ===== BACKGROUND ===== */

body::before{
    content:"";
    position:fixed;
    width:420px;
    height:420px;
    left:50%;
    top:48%;
    transform:translate(-50%,-50%);
    background:radial-gradient(
        circle,
        rgba(255,215,0,.18) 0%,
        rgba(255,215,0,.07) 35%,
        transparent 72%
    );
    filter:blur(20px);
    pointer-events:none;
}

/* ===== PHONE DISPLAY AREA ===== */

.phone-screen{
    width:100%;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:flex-start;

    padding:28px 14px 35px;

    position:relative;
}

/* ===== MAIN CARD ===== */

.card{
    width:100%;
    max-width:390px;

    margin-top:5px;

    padding:28px 18px 25px;

    text-align:center;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.008)
        );

    border:1px solid rgba(255,215,0,.25);

    border-radius:32px;

    box-shadow:
        0 0 15px rgba(255,215,0,.12),
        0 0 45px rgba(255,215,0,.08),
        inset 0 1px 0 rgba(255,255,255,.08);

    backdrop-filter:blur(15px);
}

/* ===== PROFILE ===== */

.profile{
    width:150px;
    height:150px;

    margin:auto;

    padding:4px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #fff4a8,
            #ffd700,
            #b8860b,
            #fff1a1
        );

    box-shadow:
        0 0 18px rgba(255,215,0,.8),
        0 0 45px rgba(255,215,0,.35);
}

.profile img{
    width:100%;
    height:100%;

    object-fit:cover;

    border-radius:50%;

    display:block;

    border:3px solid #080808;
}

/* ===== TITLE ===== */

.title{
    margin-top:22px;

    font-size:36px;
    line-height:1.05;

    font-weight:900;

    letter-spacing:-1px;

    color:#fff;

    text-shadow:
        0 0 12px rgba(255,255,255,.15);
}

/* ===== SUBTITLE ===== */

.subtitle{
    margin-top:14px;

    font-size:15px;
    line-height:1.5;

    color:#d6d6d6;
}

/* ===== BUTTON ===== */

.join-btn{
    display:block;

    margin:25px auto 0;

    width:100%;

    padding:17px 12px;

    border-radius:50px;

    text-decoration:none;

    font-size:17px;
    font-weight:900;

    color:#080808;

    background:
        linear-gradient(
            110deg,
            #c89b20,
            #fff1a3,
            #ffd700,
            #fff3ad
        );

    box-shadow:
        0 0 15px rgba(255,215,0,.5),
        0 7px 25px rgba(255,215,0,.16);

    transition:.25s ease;

    position:relative;
    overflow:hidden;
}

.join-btn::before{
    content:"";

    position:absolute;

    top:0;
    left:-100%;

    width:70%;
    height:100%;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.7),
        transparent
    );

    transform:skewX(-20deg);

    animation:shine 2.8s infinite;
}

@keyframes shine{
    0%{
        left:-100%;
    }

    55%,100%{
        left:130%;
    }
}

.join-btn:active{
    transform:scale(.97);
}

/* ===== ACTIVE COMMUNITY ===== */

.info{
    margin-top:22px;

    display:flex;
    justify-content:center;
    align-items:center;
    gap:7px;

    color:#ffd700;

    font-size:14px;
    font-weight:700;
}

.info-dot{
    width:8px;
    height:8px;

    background:#00ff66;

    border-radius:50%;

    box-shadow:0 0 12px #00ff66;

    animation:pulse 1.4s infinite;
}

@keyframes pulse{
    0%,100%{
        transform:scale(1);
        opacity:1;
    }

    50%{
        transform:scale(1.5);
        opacity:.55;
    }
}

/* ===== FOOTER ===== */

.footer{
    margin-top:15px;

    font-size:11px;

    letter-spacing:.4px;

    color:#777;
}

/* ===== TIMER ===== */

.timer-box{
    margin-top:20px;

    padding-top:17px;

    border-top:1px solid rgba(255,215,0,.12);

    color:#777;

    font-size:11px;
}

#count{
    color:#ffd700;
    font-weight:bold;
}

/* ===== MEMBERS ===== */

.members-joined{
    margin-top:18px;

    display:flex;
    justify-content:center;
    align-items:center;

    gap:8px;

    font-size:12px;
    font-weight:600;

    color:#ddd;
}

.dot{
    width:8px;
    height:8px;

    border-radius:50%;

    background:#00ff66;

    box-shadow:0 0 10px #00ff66;

    animation:pulse 1.2s infinite;
}

/* ===== MOBILE ===== */

@media(max-width:480px){

    .phone-screen{
        padding:
            18px 12px
            28px;
    }

    .card{
        max-width:100%;

        padding:
            24px 16px 22px;

        border-radius:28px;
    }

    .profile{
        width:145px;
        height:145px;
    }

    .title{
        font-size:34px;
    }

    .subtitle{
        font-size:14px;
    }

    .join-btn{
        font-size:16px;
        padding:16px 10px;
    }
}

/* ===== VERY SMALL PHONES ===== */

@media(max-height:700px){

    .phone-screen{
        padding-top:12px;
    }

    .card{
        padding-top:20px;
    }

    .profile{
        width:125px;
        height:125px;
    }

    .title{
        margin-top:16px;
        font-size:31px;
    }

    .join-btn{
        margin-top:20px;
    }

    .timer-box{
        margin-top:15px;
    }
}

</style>
</head>

<body>

<div class="phone-screen">

    <div class="card">

        <!-- PROFILE -->
        <div class="profile">
            <img src="https://d1yei2z3i6k35z.cloudfront.net/18362304/6a53479ff39b01.28859413_5576.jpg">
        </div>

        <!-- TITLE -->
        <h1 class="title">
            AKASH ARMY 🔥
        </h1>

        <!-- SUBTITLE -->
        <p class="subtitle">
            Join the official Telegram channel for updates.
        </p>

        <!-- JOIN BUTTON -->
        <a
            href="https://t.me/+6kRZO-8UobYyYzll"
            class="join-btn"
        >
            🚀 JOIN TELEGRAM NOW 🚀
        </a>

        <!-- ACTIVE -->
        <div class="info">
            <span class="info-dot"></span>
            ⭐ Active Telegram Community
        </div>

        <!-- FOOTER -->
        <div class="footer">
            100% FREE | NO SPAM | INSTANT UPDATES
        </div>

        <!-- TIMER -->
        <div class="timer-box">
            Joining Telegram in
            <span id="count">2</span>
            seconds...
        </div>

    </div>

</div>

<!-- MEMBERS -->
<div class="members-joined">
    <span class="dot"></span>
    <span>999+ Members Joining Already</span>
</div>

<script>

let time = 2;

const timer = setInterval(function(){

    time--;

    document.getElementById("count").innerText = time;

    if(time <= 0){

        clearInterval(timer);

        window.location.href =
        "https://t.me/+6kRZO-8UobYyYzll";
    }

},1000);

</script>

</body>
</html>
